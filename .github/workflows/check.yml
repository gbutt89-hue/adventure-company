name: Check prototype

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test game engine and syntax
        run: npm test
      - name: Build deployable site
        run: npm run build
      - name: Validate packaged PWA
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/robots.txt
          node -e "JSON.parse(require('fs').readFileSync('dist/manifest.webmanifest','utf8'))"
      - name: Package playable build
        uses: actions/upload-artifact@v4
        with:
          name: adventure-company-pwa
          path: dist
          if-no-files-found: error
